name: Verify MFCase V5.2.8 Windows updater and local privacy files
# Validate final manual-review edit-protection update package
on:
  push:
    branches: [publish/v5.2.8-manual-update-offline]
    paths: [.github/workflows/test-windows-v5.2.8.yml]
permissions: {contents: read}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply real GitHub V5.2.8 ZIP without altering PDFs or learning
        shell: pwsh
        run: python tools/test_update_windows_v528.py
