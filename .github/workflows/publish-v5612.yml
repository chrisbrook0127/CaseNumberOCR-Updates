name: Publish MFCase v5.6.12 multi-crop location learning
on:
  push:
    branches: [publish/v5.6.12]
    paths:
      - .github/workflows/publish-v5612.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mfcase-release-v5612
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install numpy pillow 'pymupdf<2.0' opencv-python-headless
      - name: Verify and extract official v5.6.11 production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p baseline stage transfer dist verify
          gh release download v5.6.11 --repo "$GITHUB_REPOSITORY" --pattern MFCase_Number_OCR_V5.6.11_Full_Online_Install.zip --dir baseline
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          p=Path('baseline/MFCase_Number_OCR_V5.6.11_Full_Online_Install.zip')
          h=sha256(p.read_bytes()).hexdigest()
          assert h=='bd749ac4526b2e030de6a23b1a4f591f928a1f3ef490b21b82b2833974987630',h
          with ZipFile(p) as z:
              assert z.testzip() is None
              assert all(not x.startswith('/') and '..' not in Path(x).parts for x in z.namelist())
              z.extractall('stage')
          sources=list(Path('stage').rglob('case_number_ocr.py'))
          assert len(sources)==1
          h=sha256(sources[0].read_bytes()).hexdigest()
          assert h=='692aa5d278a0976d2414b1bc5c4751ea69d02e53963fe71223fcfc0d548b3441',h
          print('PASS verified official v5.6.11 application baseline',flush=True)
          PY
      - name: Restore complete checked patch from five GitHub transfer parts
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from hashlib import sha256
          from base64 import b64decode
          paths=[f'tools/release_5612_part_{part}.txt'
                 for part in ('0','1','2','3a','3b1','3b2')]
          encoded=''.join(Path(n).read_text(encoding='utf8').strip() for n in paths)
          assert len(encoded)==13188,len(encoded)
          payload=b64decode(encoded,validate=True)
          h=sha256(payload).hexdigest()
          assert h=='3fc48a9932ac8a4d4217e0522772dfa44699d472a0089c1dcbf4f4cebff1a767',h
          with ZipFile(BytesIO(payload)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={'patch_5612.diff','test_release_5612.py'}
              z.extractall('transfer')
          print('PASS all six patch pieces, ZIP and SHA-256',flush=True)
          PY
      - name: Apply location-only change and verify exact tested source
        run: |
          set -eu
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          (cd "$APP" && patch --batch --forward --fuzz=0 -p1 -i "$GITHUB_WORKSPACE/transfer/patch_5612.diff")
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          app=next(Path('stage').rglob('case_number_ocr.py')).parent
          src=app/'case_number_ocr.py'
          h=sha256(src.read_bytes()).hexdigest()
          assert h=='7e333051c987a0d4cd358183d86ab20ac79efc813333de3f0e76571b6504e83c',h
          text=src.read_text('utf8')
          assert 'self.app_version = "5.6.12"' in text
          assert 'root.title("M.F. Case Number OCR — V5.6.12")' in text
          assert '_learned_crop_clusters' in text and '_ranked_learned_scan_zones' in text
          assert 'Show learned scan areas' in text
          assert 'def _sequence_consensus_plan' in text
          assert 'region=image[:side,offset_x:].copy()' in text
          assert 'CASE_RE.fullmatch' in text
          tests=app/'tests';tests.mkdir(exist_ok=True)
          (tests/'test_release_5612.py').write_bytes(Path('transfer/test_release_5612.py').read_bytes())
          (app/'CHANGELOG_V5_6_12.txt').write_text(
              'MFCase v5.6.12 — learn scan locations from every verified manual crop.\n'
              '- Keep ALL retained crop coordinates (no 200-example truncation).\n'
              '- Group crops from different form layouts, robustly average position/size, rank by examples.\n'
              '- Check every ranked location with TrOCR handwriting first and EasyOCR printed second.\n'
              '- If learned locations fail, retain existing upper-right quarter OCR fallback.\n'
              '- Allow verified full-page manual crops outside the quarter; no unrestricted page scanning.\n'
              '- Show ranked crop-area overlays in existing review screen.\n'
              '- Preserve mandatory 08-, 95% auto-completion, anchors, SEND FILES and offline safety.\n',
              encoding='utf8')
          names=('case_number_ocr.py','updater_apply.py','SETUP.bat','README_FIRST.txt')
          manifest={name:sha256((app/name).read_bytes()).hexdigest() for name in names}
          (app/'verify_package.py').write_text(
              'from pathlib import Path\nfrom hashlib import sha256\nROOT=Path(__file__).resolve().parent\nEXPECTED='
              +repr(manifest)+'\nfor n,d in EXPECTED.items():\n'
              +'    assert sha256((ROOT/n).read_bytes()).hexdigest()==d,n\n'
              +"print('PASS MFCase v5.6.12 integrity')\n",encoding='utf8')
          print('PASS exact locally tested v5.6.12 source SHA-256',flush=True)
          PY
          python -m py_compile "$APP/case_number_ocr.py" "$APP/updater_apply.py"
          python "$APP/verify_package.py"
      - name: Run 78 existing and new tests plus GUI startup
        run: |
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          PYTHONPATH="$APP" python -m unittest discover -s "$APP/tests" -p 'test_release_5*.py' -v
          MFCASE_SKIP_STARTUP_MAINTENANCE=1 PYTHONPATH="$APP" xvfb-run -a python - <<'PY'
          import tkinter as tk
          from case_number_ocr import App
          root=tk.Tk();app=App(root);root.update_idletasks()
          assert app.app_version=='5.6.12'
          assert 'V5.6.12' in root.title()
          assert app.tree.winfo_exists()
          root.destroy()
          print('PASS GUI launch',flush=True)
          PY
      - name: Build safe ZIPs and simulate in-place update
        run: |
          python - <<'PY'
          import hashlib,importlib.util,shutil,subprocess,sys,tempfile
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          app=next(Path('stage').rglob('case_number_ocr.py')).parent
          out=Path('dist');out.mkdir(exist_ok=True)
          update_files=['case_number_ocr.py','updater_apply.py','SETUP.bat',
              'RUN_CASE_OCR.bat','RUN_CASE_OCR_DEBUG.bat','Launch_Case_OCR.vbs',
              'MF.ico','CREATE_DESKTOP_SHORTCUT.bat','Create_Desktop_Shortcut.vbs',
              'README_FIRST.txt','verify_package.py','update_config.json',
              'CHANGELOG_V5_6_12.txt']
          all_files=list(update_files)
          all_files.extend(f.name for f in app.glob('CHANGELOG_V5_*.txt') if f.name not in all_files)
          all_files.extend(str(f.relative_to(app)) for f in (app/'tests').glob('test_*.py'))
          all_files.append('MFCase_Combine_And_Trace.py')
          assert all((app/f).is_file() for f in set(all_files))
          artifacts=[]
          for name,files,prefix in (
              ('CaseNumberOCR_Update.zip',update_files,''),
              ('MFCase_Number_OCR_V5.6.12_Full_Online_Install.zip',all_files,
               'MFCase_Number_OCR_V5.6.12_Full_Online_Install/')):
              p=out/name
              with ZipFile(p,'w',ZIP_DEFLATED,compresslevel=9) as z:
                  for f in sorted(set(files)):z.write(app/f,prefix+f)
              with ZipFile(p) as z:
                  assert z.testzip() is None
                  assert all('..' not in Path(n).parts and not n.lower().endswith(
                       ('.pdf','.pt','.pth','.sqlite','.log','.jsonl')) for n in z.namelist())
              artifacts.append(p)
              print('BUILT',p,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          spec=importlib.util.spec_from_file_location('updater',app/'updater_apply.py')
          updater=importlib.util.module_from_spec(spec);spec.loader.exec_module(updater)
          with tempfile.TemporaryDirectory() as folder:
              d=Path(folder)
              for f in ('case_number_ocr.py','SETUP.bat','README_FIRST.txt'):(d/f).write_text('old')
              (d/'case.pdf').write_text('private PDF')
              (d/'learning_examples_v3.json').write_text('private learning')
              (d/'.case_ocr_state.json').write_text('private case state')
              (d/'mfcase_work_history.txt').write_text('private log')
              (d/'models').mkdir()
              (d/'models/checkpoint.pt').write_text('private checkpoint')
              archive=d/'update.zip';shutil.copy2(artifacts[0],archive)
              updater.apply_update(d,archive)
              assert 'self.app_version = "5.6.12"' in (d/'case_number_ocr.py').read_text()
              assert (d/'case.pdf').read_text()=='private PDF'
              assert (d/'learning_examples_v3.json').read_text()=='private learning'
              assert (d/'.case_ocr_state.json').read_text()=='private case state'
              assert (d/'mfcase_work_history.txt').read_text()=='private log'
              assert (d/'models/checkpoint.pt').read_text()=='private checkpoint'
              subprocess.run([sys.executable,str(d/'verify_package.py')],check=True)
          print('PASS updater safely preserves local user data',flush=True)
          PY
      - name: Publish latest release and verify downloadable updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=v5.6.12
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          test -s dist/CaseNumberOCR_Update.zip
          test -s dist/MFCase_Number_OCR_V5.6.12_Full_Online_Install.zip
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "MFCase v5.6.12" --notes-file "$APP/CHANGELOG_V5_6_12.txt"
          fi
          gh release upload "$TAG" "$PWD/dist/CaseNumberOCR_Update.zip" "$PWD/dist/MFCase_Number_OCR_V5.6.12_Full_Online_Install.zip" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern CaseNumberOCR_Update.zip --dir verify
          cmp dist/CaseNumberOCR_Update.zip verify/CaseNumberOCR_Update.zip
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
