name: Inspect V5.2.3 OCR and SCAN progress
on:
  push:
    branches: [publish/v5.2.4-progress-case-priority]
    paths: [.github/workflows/inspect-v524.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print shipped method locations and actual code
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,zipfile,ast,re
          raw=base64.b64decode(Path("release-assets/update.base64").read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=="33d4a12efa80ccaeaf3e220c99640ee8b710822664e07adc1240362a0c7dedb2"
          with zipfile.ZipFile(io.BytesIO(raw)) as z: s=z.read("case_number_ocr.py").decode()
          lines=s.splitlines();t=ast.parse(s)
          names={"__init__","_ocr_pdf","_diag_field_filter","_select_primary_case_hit",
                 "_read_incident_to_right","_merge_case_hits","_refresh_scan_button",
                 "_scan_worker","_poll","start_scan","scan","_make_scan_preview",
                 "_insert_scan_row","_sequence_case_number",
                 "_update_scan_file_count","_build_ui","_start_scan"}
          print("==== method names ====")
          for n in ast.walk(t):
              if isinstance(n,ast.FunctionDef) and (n.name in names or "progress" in n.name.lower()):
                  print("METHOD",n.name,n.lineno,n.end_lineno)
          for n in ast.walk(t):
              if isinstance(n,ast.FunctionDef) and n.name in names:
                  print("=== START",n.name,n.lineno,n.end_lineno)
                  beg=n.lineno;end=n.end_lineno
                  if n.name=="__init__":end=min(end,beg+235)
                  if n.name=="_poll":
                      for i in range(beg,end):
                          if 'kind == "row"' in lines[i-1]:beg=i-7;break
                      end=min(end,beg+190)
                  if n.name=="_ocr_pdf":end=min(end,beg+235)
                  for i in range(beg,end+1):
                      print(f"{i}: {lines[i-1]}")
          print("==== indicator references ====")
          for i,l in enumerate(lines,1):
              if re.search(r"progress|scanning [0-9]|scan_progress|queue.put\(\([\"']row|_diag_field_filter",l,re.I):
                  if len(l)<350:print(f"FIND {i}: {l}")
          PY