name: Validate MFCase V5.2.3 OCR and post-scan sending
# Test rebuilt multi-file range inference against V5.2.3 exact package
on:
  push:
    branches: [publish/v5.2.3-fallback-autoexport]
    paths: [.github/workflows/test-v5.2.3.yml]
permissions: {contents: read}
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exact shipped 100 percent fallback, manual and automatic export rules
        run: python tools/test_v5_2_3_rules.py
  range-consensus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test multi-file before/after scan ranges and OCR anchor safeguards
        run: python tools/test_v5_2_3_range.py
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install virtual desktop and graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -q numpy pillow
      - name: Regress real SCAN row images, root-only listing, REVIEW SELECTED and exports
        run: xvfb-run -a python tools/test_v5_2_2_ui.py
