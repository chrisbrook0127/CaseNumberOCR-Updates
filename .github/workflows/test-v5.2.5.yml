name: Test MFCase V5.2.5 case OCR, sequence and UI
# Include updated independent-anchor range harness
on:
  push:
    branches: [publish/v5.2.5-upper-right-case-ocr]
    paths: [.github/workflows/test-v5.2.5.yml]
permissions: {contents: read}
jobs:
  ocr-and-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real image processing dependency for OCR test
        run: python -m pip install -q numpy pillow
      - name: Exercise actual 08-44 right-margin and fax suppression
        run: python tools/test_v5_2_5_ocr.py
      - name: Verify original 08-44 false-conflict and scan-progress rules
        run: python tools/test_v5_2_5_legacy_rules.py
      - name: Test entire matching before/after range in source scan order
        run: python tools/test_v5_2_5_range.py
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install virtual display and raster dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -q numpy pillow
      - name: Test real Tk UI root listing, progress, review and thumbnails
        run: xvfb-run -a python tools/test_v5_2_4_ui.py
