name: Regress MFCase 5.2.2 95-percent OCR and scan preview
on:
  push:
    branches: [publish/v5.2.2-field-thumbnails]
    paths: [.github/workflows/test-v5.2.2.yml]
permissions: {contents: read}
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exact shipped-method field, conflict and sequence tests
        run: python tools/test_v5_2_2_rules.py
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup virtual UI and image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
          python -m pip install -q numpy pillow
      - name: Render real SCAN thumbnails and review selection
        run: xvfb-run -a python tools/test_v5_2_2_ui.py
