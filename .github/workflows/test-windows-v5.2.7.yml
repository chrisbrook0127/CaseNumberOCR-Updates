name: Verify MFCase V5.2.7 updater and data preservation Windows
# Final candidate includes return-to-list after manual SAVE REVIEW
on:
  push:
    branches: [publish/v5.2.7-manual-review-send-selected]
    paths: [.github/workflows/test-windows-v5.2.7.yml]
permissions: {contents: read}
jobs:
  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply exact V5.2.7 release; verify data and unsafe archive refusal
        shell: pwsh
        run: python tools/test_update_windows_v527.py
