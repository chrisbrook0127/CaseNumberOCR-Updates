name: Inspect V3.3.6 normalized training type
on:
  push:
    branches:
      - "publish/**"
    paths:
      - "release-assets/PUBLISH_REQUEST.txt"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract method and calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release-assets/inspect_337.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-assets/inspect337/normalized_type_report.txt
          git commit -m "Inspect V3.3.6 normalized training type"
          git push
