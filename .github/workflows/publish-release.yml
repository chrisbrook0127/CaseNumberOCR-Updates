name: Inspect current Case Number OCR package
on:
  push:
    branches:
      - "publish/**"
    paths:
      - "release-assets/PUBLISH_REQUEST.txt"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release-assets/inspect_v3_3_5.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-assets/inspect/source_report.txt
          git commit -m "Add source inspection report for V3.3.5"
          git push
