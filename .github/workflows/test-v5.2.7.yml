name: Test MFCase V5.2.7 manual review, refresh and send
on:
  push:
    branches: [publish/v5.2.7-manual-review-send-selected]
    paths: [.github/workflows/test-v5.2.7.yml]
permissions: {contents: read}
jobs:
  real-tk-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install virtual display and bitmap dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y xvfb python3-tk
          python -m pip install -q numpy pillow
      - name: Test correction and refresh spinner in real Tk interface
        run: xvfb-run -a python tools/test_v5_2_7_ui.py
  year-and-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependencies
        run: python -m pip install -q numpy pillow
      - name: Confirm mandatory 08 year in all approvals
        run: python tools/test_v5_2_6_year.py
      - name: Confirm handwritten 08 OCR and false-fax rejection
        run: python tools/test_v5_2_6_ocr.py
      - name: Confirm multi-file before/after range inference
        run: python tools/test_v5_2_6_range.py
