name: Publish MFCase v5.5.4 installation and scanning repair
on:
  push:
    branches:
      - publish/v5.5.4
    paths:
      - .github/workflows/publish-v554.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mfcase-publish-v554
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless GUI test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install numpy pillow 'pymupdf<2.0'
      - name: Apply v5.5.3 review plus v5.5.4 fixes, run tests and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/build_release_554.py
      - name: Publish release and verify downloadable updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=v5.5.4
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "MFCase v5.5.4" --notes-file release-build-v554/stage/MFCase_Number_OCR_V5.5.2_Full_Online_Install/CHANGELOG_V5_5_4.txt
          fi
          gh release upload "$TAG" dist/CaseNumberOCR_Update.zip dist/MFCase_Number_OCR_V5.5.4_Full_Online_Install.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern CaseNumberOCR_Update.zip --dir verify
          cmp dist/CaseNumberOCR_Update.zip verify/CaseNumberOCR_Update.zip
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
