name: MFCase v6.0.1 protected release
# Run 2: same approved source, cross-platform UTF-8 and Windows FileHandler test fixes
on:
  push:
    branches:
      - publish/v6.0.1
    paths:
      - .github/workflows/publish-v601.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mfcase-v601-release
  cancel-in-progress: false
jobs:
  linux_validation:
    name: Linux regressions GUI and package safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless GUI and regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install numpy pillow 'pymupdf<2.0' opencv-python-headless
      - name: Fetch verified official v6.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          gh release download v6.0.0 --repo "$GITHUB_REPOSITORY" --pattern MFCase_Number_OCR_V6.0.0_Full_Online_Install.zip --dir baseline
      - name: Apply only audited v6.0.1 delta
        run: python tools/assemble_v601.py assemble
      - name: Run original and approved change regressions
        run: |
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          PYTHONPATH="$APP:$APP/tests" python -m unittest discover -s "$APP/tests" -p 'test_release_*.py' -q
      - name: Verify real GUI and default full-list behavior
        env:
          MFCASE_SKIP_STARTUP_MAINTENANCE: '1'
        run: |
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          PYTHONPATH="$APP" xvfb-run -a python - <<'PY'
          import tkinter as tk
          from case_number_ocr import App
          root=tk.Tk()
          app=App(root)
          root.update()
          assert app.app_version=='6.0.1'
          assert app.show_all_files_var.get() is True
          assert app.tree.winfo_exists()
          assert app.pie_transport.winfo_exists()
          assert set(app.pie_transport.actions)=={'folder','scan','pause','stop'}
          assert len(app.pie_transport._hitboxes)==4
          app._open_settings_window()
          root.update()
          assert int(app.threshold_scale.cget('from'))==90
          assert int(app.threshold_scale.cget('to'))==99
          assert callable(app._show_order_popup)
          root.destroy()
          print('PASS original UI, full list, 90-99 confidence and order popup')
          PY
      - name: Produce installer and updater and verify in-place upgrade
        run: python tools/assemble_v601.py package
      - uses: actions/upload-artifact@v4
        with:
          name: mfcase-v601-verified-assets
          path: |
            dist/CaseNumberOCR_Update.zip
            dist/MFCase_Number_OCR_V6.0.1_Full_Online_Install.zip
            dist/SHA256SUMS.json
          if-no-files-found: error
          retention-days: 14

  windows_validation:
    name: Windows Python regressions and updater compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install numpy pillow "pymupdf<2.0" opencv-python-headless
      - name: Fetch official v6.0.0 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path baseline -Force | Out-Null
          gh release download v6.0.0 --repo "$env:GITHUB_REPOSITORY" --pattern MFCase_Number_OCR_V6.0.0_Full_Online_Install.zip --dir baseline
      - name: Apply protected source and verify crop-location invariants
        run: python tools/assemble_v601.py assemble
      - name: Test Windows sequencing, OCR, training and recovery
        shell: pwsh
        run: |
          $app=(Get-ChildItem -Path stage -Filter case_number_ocr.py -Recurse | Select-Object -First 1).Directory.FullName
          $env:PYTHONPATH="$app;$app\tests"
          python -m unittest discover -s "$app\tests" -p "test_release_*.py" -q
      - name: Test Windows in-place updater safety
        run: python tools/assemble_v601.py package

  release:
    name: Publish only after Linux and Windows validation
    runs-on: ubuntu-latest
    needs: [linux_validation, windows_validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mfcase-v601-verified-assets
          path: dist
      - name: Verify SHA256 manifest and files
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          dist=Path('dist')
          expected=json.loads((dist/'SHA256SUMS.json').read_text('utf8'))
          assert set(expected)=={'CaseNumberOCR_Update.zip','MFCase_Number_OCR_V6.0.1_Full_Online_Install.zip'}
          for name,sha in expected.items():
              content=(dist/name).read_bytes()
              assert hashlib.sha256(content).hexdigest()==sha,name
              assert len(content)>100000,name
              print('PASS',name,'SHA256',sha)
          PY
      - name: Publish v6.0.1 with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=v6.0.1
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "MFCase v6.0.1" --notes "Eight approved improvements built from verified v6.0.0 baseline. Sequence-lock boundaries, order confirmation, before/after precedence, anomaly review, OCR confidence, visually verified learning, recoverable 5,000-file persistence and full-list default. Regression, Windows, GUI and updater preservation verified."
          fi
          gh release upload "$TAG" dist/CaseNumberOCR_Update.zip dist/MFCase_Number_OCR_V6.0.1_Full_Online_Install.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          mkdir -p check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern CaseNumberOCR_Update.zip --dir check
          cmp dist/CaseNumberOCR_Update.zip check/CaseNumberOCR_Update.zip
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets