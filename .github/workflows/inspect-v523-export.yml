name: Inspect final V522 scan completion and export specifics
on:
  push:
    branches: [publish/v5.2.3-fallback-autoexport]
    paths: [.github/workflows/inspect-v523-export.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print final gate context
        run: |
          python3 - <<'PY'
          import base64,io,hashlib,zipfile
          from pathlib import Path
          b=base64.b64decode(Path('release-assets/update.base64').read_text(),validate=True)
          assert hashlib.sha256(b).hexdigest()=='97c8f05fd9ffbe1b806967a0974682b50717651f106945330d04a222e589d196'
          with zipfile.ZipFile(io.BytesIO(b)) as z:s=z.read('case_number_ocr.py').decode()
          l=s.splitlines()
          for lo,hi in [(3945,3992),(4547,4590),(6040,6190),(5313,5386),(2600,2665)]:
              print('===== RANGE',lo,hi)
              for i in range(lo,hi+1):print(f'{i}: {l[i-1]}')
          PY