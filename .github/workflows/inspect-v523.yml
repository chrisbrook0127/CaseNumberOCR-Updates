name: Inspect V5.2.2 fallback and export completion
on:
  push:
    branches: [publish/v5.2.3-fallback-autoexport]
    paths: [.github/workflows/inspect-v523.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze exact 5.2.2 shipped OCR and export paths
        run: |
          python3 - <<'PY'
          import ast,base64,hashlib,io,zipfile,pathlib
          p=pathlib.Path("release-assets/update.base64")
          b=base64.b64decode(p.read_text(),validate=True)
          assert hashlib.sha256(b).hexdigest()=="97c8f05fd9ffbe1b806967a0974682b50717651f106945330d04a222e589d196"
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              s=z.read("case_number_ocr.py").decode()
          t=ast.parse(s); lines=s.splitlines()
          print("======== METHODS")
          for n in ast.walk(t):
              if isinstance(n,ast.FunctionDef) and any(k in n.name for k in ("export","schedule","poll","scan","refresh","folder","candidate","ocr","source","sequence","auto_label")):
                  print(n.name,n.lineno,n.end_lineno)
          for n in ast.walk(t):
              if isinstance(n,ast.FunctionDef) and n.name in (
                  "_poll","_schedule_auto_export","_export_worker",
                  "export","_eligible_for_kurt","_start_scan","_scan_worker",
                  "_get_auto_threshold","_auto_label_block_reason",
                  "_sequence_case_number","_sequence_index"):
                  print("======== METHOD",n.name,n.lineno,n.end_lineno)
                  beg=n.lineno
                  if n.name=="_poll":
                      for k in range(beg,n.end_lineno):
                          if 'kind == "done"' in lines[k-1] or 'kind == "row"' in lines[k-1]:
                              beg=k
                              break
                  for j in range(beg,min(n.end_lineno,beg+190)+1):
                      print(f"{j}: {lines[j-1]}")
          print("======== EXTRA HITS")
          for j,line in enumerate(lines,1):
              if any(k in line for k in (
                  'kind == "done"', 'kind == "scan_done"', '"export_done"',
                  '_schedule_auto_export(', 'export_busy = False',
                  'ready for export','Upper-right fallback','self.export(',
                  '_scan_source','scan_source=("incident"')):
                  print(f"{j}: {line}")
          PY