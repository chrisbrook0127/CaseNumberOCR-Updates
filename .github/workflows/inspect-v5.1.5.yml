name: Inspect v5.1.4 sequence and updater
on:
  push:
    branches: [publish/v5.1.5-scan-order-updater]
    paths: [.github/workflows/inspect-v5.1.5.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact sequence and updater source excerpts
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, zipfile, ast, pathlib
          r=pathlib.Path('release-assets')
          raw=base64.b64decode((r/'update.base64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='8830ce832e78f5e4eeece7e45de820c4b9fa6b6ce1e6c95c01b16a08a28dabe2'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              s=z.read('case_number_ocr.py').decode()
              u=z.read('updater_apply.py').decode()
          t=ast.parse(s);lines=s.splitlines()
          for n in ast.walk(t):
              if isinstance(n,ast.FunctionDef) and n.name in {'_sequence_index','_sequence_neighbors','_sequence_case_number','scan','_start_update','check_for_updates','_begin_startup_updates','_update_worker','_apply_update','_natural_pdf_sort_key','_diag_start_run','_apply_folder_load','_version_tuple'}:
                  print('===',n.name,n.lineno,n.end_lineno)
                  for j in range(n.lineno,min(n.end_lineno,n.lineno+125)+1):print(f'{j}: {lines[j-1]}')
          for j,line in enumerate(lines,1):
              if 'self.scan_items.sort(' in line or 'root.title(' in line or 'app_version =' in line or 'UPDATE' in line and 'ttk' in line:
                  print(f'MATCH {j}: {line}')
          print('=== UPDATER_HELPER ===')
          for j,line in enumerate(u.splitlines(),1):
              if j<200:print(f'{j}: {line}')
          PY