name: Test MFCase V5.3.1 privacy, manual review and OCR
on:
  push:
    branches: [publish/v5.2.8-manual-offline-private]
    paths: [.github/workflows/test-v5.3.1.yml]
permissions: {contents: read}
jobs:
  privacy-and-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OCR test dependencies
        run: python -m pip install -q numpy pillow
      - name: Check offline startup with blocked network and review protection
        run: python tools/test_v5_3_1_security_ocr.py
      - name: Test mandatory 08- case number in all paths
        run: python tools/test_v5_3_1_year.py
      - name: Test multi-file before-and-after range rule
        run: python tools/test_v5_3_1_range.py
      - name: Test handwriting and enlarged fallback rules
        run: python tools/test_v5_3_1_handwriting.py
  real-review-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install virtual desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y xvfb python3-tk
          python -m pip install -q numpy pillow
      - name: Manually correct 08- case, refresh and send selected in real Tk UI
        run: xvfb-run -a python tools/test_v5_3_1_ui.py
