name: Test MFCase V5.2.1 real root-folder review UI
on:
  push:
    branches: [publish/v5.2.1-root-review]
    paths: [.github/workflows/test-v5.2.1.yml]
permissions: {contents: read}
jobs:
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install virtual desktop and UI test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y xvfb python3-tk
          python -m pip install --quiet numpy pillow
      - name: Exercise actual application from release ZIP under virtual display
        run: xvfb-run -a python tools/test_v5_2_1.py
