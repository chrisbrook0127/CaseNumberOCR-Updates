name: Publish MFCase v5.6.11 incident-field location selection
on:
  push:
    branches:
      - publish/v5.6.11
    paths:
      - .github/workflows/publish-v5611.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mfcase-release-5611
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless OCR test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install numpy pillow 'pymupdf<2.0' opencv-python-headless
      - name: Download checksum-verified current v5.6.10 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p baseline stage transfer dist verify
          gh release download v5.6.10 --repo "$GITHUB_REPOSITORY" --pattern MFCase_Number_OCR_V5.6.10_Full_Online_Install.zip --dir baseline
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          f=Path('baseline/MFCase_Number_OCR_V5.6.10_Full_Online_Install.zip')
          actual=sha256(f.read_bytes()).hexdigest()
          assert actual=='0154db46ed767a7c277cb93e1681f9d639988cfaba1f34314c4c62822f85051f',actual
          with ZipFile(f) as z:
              assert z.testzip() is None
              assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
              z.extractall('stage')
          source=list(Path('stage').rglob('case_number_ocr.py'))
          assert len(source)==1
          app=source[0].read_text('utf8')
          assert 'self.app_version = "5.6.10"' in app
          assert 'root.title("M.F. Case Number OCR — V5.6.10")' in app
          assert 'def _sequence_consensus_plan(' in app
          assert 'def _automatic_handwritten_4x4(' in app
          print('PASS current official baseline',sha256(source[0].read_bytes()).hexdigest())
          PY
      - name: Decode exact locally tested location-only patch and six tests
        run: |
          python - <<'PY'
          import base64
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          content=base64.b64decode(Path('tools/transfer_5611.b64').read_text().strip(),validate=True)
          assert sha256(content).hexdigest()=='98413f29ce7d379352221765f4017ada83c0efbfa006f6e0f39a897f520ea914'
          with ZipFile(BytesIO(content)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={'patch_5611.py','test_release_5611.py'}
              z.extractall('transfer')
          print('PASS verified patch transfer')
          PY
      - name: Patch only incident-field selection and version string
        run: |
          set -eu
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          python - <<'PY'
          import ast,hashlib
          from pathlib import Path
          p=next(Path('stage').rglob('case_number_ocr.py'))
          s=p.read_text('utf8')
          before=ast.parse(s)
          def methods(tree):
              return {n.name:ast.dump(n,include_attributes=False)
                      for n in ast.walk(tree) if isinstance(n,ast.FunctionDef)}
          old=methods(before)
          Path('transfer/before_5611.sha256').write_text(hashlib.sha256(s.encode()).hexdigest())
          PY
          python transfer/patch_5611.py "$APP/case_number_ocr.py"
          python - <<'PY'
          import ast
          from pathlib import Path
          path=next(Path('stage').rglob('case_number_ocr.py'))
          oldsource=next(Path('baseline').glob('MFCase_Number_OCR_V5.6.10_Full_Online_Install.zip'))
          from zipfile import ZipFile
          with ZipFile(oldsource) as z:
              original=z.read(next(n for n in z.namelist() if n.endswith('/case_number_ocr.py'))).decode()
          changed=path.read_text('utf8')
          def methods(s):
              return {n.name:ast.dump(n,include_attributes=False)
                      for n in ast.walk(ast.parse(s)) if isinstance(n,ast.FunctionDef)}
          old,new=methods(original),methods(changed)
          affected={name for name in old if old[name]!=new[name]}
          assert affected=={'_select_primary_case_hit','_automatic_handwritten_4x4'},affected
          assert old.keys()==new.keys()
          assert 'self.app_version = "5.6.11"' in changed
          assert 'root.title("M.F. Case Number OCR — V5.6.11")' in changed
          assert 'region=image[:side,offset_x:].copy()' in changed
          assert 'def _ocr_review_crop(' in changed
          print('PASS exact method changes:',sorted(affected))
          app=path.parent
          (app/'CHANGELOG_V5_6_11.txt').write_text(
              'MFCase v5.6.11 — location-selection adjustment only.\n'
              '- Prioritize the complete case-number field immediately right of INCIDENT NO./NUMBER/#.\n'
              '- Keep unlabeled printed/handwritten 08- candidates and the strict upper-right quarter.\n'
              '- Do not change OCR engines, model training, 95% approval, before/after, review, or SEND FILES.\n',
              encoding='utf8')
          (app/'tests').mkdir(exist_ok=True)
          (app/'tests/test_release_5611.py').write_text(
              Path('transfer/test_release_5611.py').read_text('utf8'),encoding='utf8')
          from hashlib import sha256
          names=('case_number_ocr.py','updater_apply.py','SETUP.bat','README_FIRST.txt')
          manifest={n:sha256((app/n).read_bytes()).hexdigest() for n in names}
          (app/'verify_package.py').write_text(
              'from pathlib import Path\nimport hashlib\nROOT=Path(__file__).resolve().parent\nEXPECTED='
              +repr(manifest)+'\nfor name,hashvalue in EXPECTED.items():\n'
              +'    assert hashlib.sha256((ROOT/name).read_bytes()).hexdigest()==hashvalue,name\n'
              +"print('PASS MFCase v5.6.11 integrity')\n",encoding='utf8')
          PY
          python -m py_compile "$APP/case_number_ocr.py" "$APP/updater_apply.py"
          python "$APP/verify_package.py"
      - name: Full existing OCR and anchor regressions plus six new tests
        run: |
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          PYTHONPATH="$APP" python -m unittest discover -s "$APP/tests" -p 'test_release_5*.py' -v
          MFCASE_SKIP_STARTUP_MAINTENANCE=1 PYTHONPATH="$APP" xvfb-run -a python - <<'PY'
          import tkinter as tk
          from case_number_ocr import App
          root=tk.Tk()
          app=App(root);root.update_idletasks()
          assert app.app_version=='5.6.11'
          assert 'V5.6.11' in root.title()
          assert app.tree.winfo_exists()
          root.destroy()
          print('PASS GUI startup and version')
          PY
      - name: Package full installer and updater, test in-place safety
        run: |
          python - <<'PY'
          import hashlib,importlib.util,shutil,subprocess,sys,tempfile
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          app=next(Path('stage').rglob('case_number_ocr.py')).parent
          out=Path('dist');out.mkdir(exist_ok=True)
          updater_files=['case_number_ocr.py','updater_apply.py','SETUP.bat',
             'RUN_CASE_OCR.bat','RUN_CASE_OCR_DEBUG.bat','Launch_Case_OCR.vbs',
             'MF.ico','CREATE_DESKTOP_SHORTCUT.bat','Create_Desktop_Shortcut.vbs',
             'README_FIRST.txt','verify_package.py','update_config.json',
             'CHANGELOG_V5_6_11.txt']
          full_files=updater_files[:]
          full_files += [p.name for p in app.glob('CHANGELOG_V5_*.txt') if p.name not in full_files]
          full_files += [str(p.relative_to(app)) for p in (app/'tests').glob('test_*.py')]
          combiner=app/'MFCase_Combine_And_Trace.py'
          if combiner.is_file():full_files.append(combiner.name)
          assert all((app/p).is_file() for p in set(full_files+updater_files))
          outputs=[]
          for name,files,prefix in [
              ('CaseNumberOCR_Update.zip',updater_files,''),
              ('MFCase_Number_OCR_V5.6.11_Full_Online_Install.zip',full_files,
               'MFCase_Number_OCR_V5.6.11_Full_Online_Install/')]:
              target=out/name
              with ZipFile(target,'w',ZIP_DEFLATED,compresslevel=9) as z:
                  for file in sorted(set(files)):z.write(app/file,prefix+file)
              with ZipFile(target) as z:
                  assert z.testzip() is None
                  assert all('..' not in Path(n).parts and not
                      n.lower().endswith(('.pdf','.pt','.pth','.log','.sqlite','.jsonl'))
                      for n in z.namelist())
              outputs.append(target)
              print('PACKAGE',name,target.stat().st_size,hashlib.sha256(target.read_bytes()).hexdigest())
          spec=importlib.util.spec_from_file_location('updater',app/'updater_apply.py')
          updater=importlib.util.module_from_spec(spec);spec.loader.exec_module(updater)
          with tempfile.TemporaryDirectory() as tmp:
              d=Path(tmp)
              for n in ('case_number_ocr.py','SETUP.bat','README_FIRST.txt'):
                  (d/n).write_text('previous')
              (d/'private.pdf').write_text('private PDF')
              (d/'.case_ocr_state.json').write_text('private state')
              (d/'learning_examples_v3.json').write_text('private learning')
              (d/'mfcase_work_history.txt').write_text('private history')
              (d/'models').mkdir()
              (d/'models/checkpoint.pt').write_text('private model')
              archive=d/'update.zip';shutil.copy2(outputs[0],archive)
              updater.apply_update(d,archive)
              assert 'self.app_version = "5.6.11"' in (d/'case_number_ocr.py').read_text()
              assert (d/'private.pdf').read_text()=='private PDF'
              assert (d/'.case_ocr_state.json').read_text()=='private state'
              assert (d/'learning_examples_v3.json').read_text()=='private learning'
              assert (d/'mfcase_work_history.txt').read_text()=='private history'
              assert (d/'models/checkpoint.pt').read_text()=='private model'
              subprocess.run([sys.executable,str(d/'verify_package.py')],check=True)
          print('PASS in-place update data protection')
          PY
      - name: Publish official release and verify updater download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=v5.6.11
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          test -s dist/CaseNumberOCR_Update.zip
          test -s dist/MFCase_Number_OCR_V5.6.11_Full_Online_Install.zip
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "MFCase v5.6.11" --notes-file "$APP/CHANGELOG_V5_6_11.txt"
          fi
          gh release upload "$TAG" "$PWD/dist/CaseNumberOCR_Update.zip" "$PWD/dist/MFCase_Number_OCR_V5.6.11_Full_Online_Install.zip" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern CaseNumberOCR_Update.zip --dir verify
          cmp dist/CaseNumberOCR_Update.zip verify/CaseNumberOCR_Update.zip
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
