name: Test MFCase V5.3.0 offline privacy and two-pass OCR
# Validate manual Entry survives subsequent red-box OCR crop selection
on:
  push:
    branches: [publish/v5.3.0-offline-ocr-security]
    paths: [.github/workflows/test-v5.3.0.yml]
permissions: {contents: read}
jobs:
  security-and-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local image libs
        run: python -m pip install -q numpy pillow
      - name: Test 3x3 first, 5x5 on no 08-, and blocked network
        run: python tools/test_v5_3_0_security_ocr.py
      - name: Verify strict 08- throughout review, learning and export
        run: python tools/test_v5_3_0_year.py
      - name: Verify prior handwriting location/printed fax suppression
        run: python tools/test_v5_3_0_handwriting.py
      - name: Verify full before-after range across multiple files
        run: python tools/test_v5_3_0_range.py
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless Tk environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y xvfb python3-tk
          python -m pip install -q numpy pillow
      - name: Test preserved manual case correction, refresh and SEND ALL SELECTED
        run: xvfb-run -a python tools/test_v5_3_0_ui.py
