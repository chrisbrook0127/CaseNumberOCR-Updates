name: Build MFCase V5.3.0 secure offline OCR
on:
  push:
    branches: [publish/v5.3.0-offline-ocr-security]
    paths: [.github/workflows/build-v5.3.0.yml]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable V5.2.7 production source
        run: git fetch --no-tags --depth=1 origin a06c4b9d668dbfc8e69b773b2cf6cfd19264d347
      - name: Build and compile offline V5.3.0
        run: python3 tools/build_v5_3_0.py
      - name: Validate ZIP, SHA and no automatic network on launch
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,zipfile,ast
          from pathlib import Path
          p=Path("release-assets")
          b=base64.b64decode((p/"update.base64").read_text(),validate=True)
          assert b==(p/"CaseNumberOCR_Update.zip").read_bytes()
          assert hashlib.sha256(b).hexdigest()==(p/"SHA256.txt").read_text().strip()
          assert (p/"RELEASE_TAG.txt").read_text().strip()=="v5.3.0"
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"case_number_ocr.py","updater_apply.py"}
              for n in z.namelist():compile(z.read(n),n,"exec")
              s=z.read("case_number_ocr.py").decode()
              assert 'REQUIRED_CASE_YEAR = "08"' in s
              assert 'return self._ocr_pdf(path,_search_inches=5)' in s
              assert 'download_enabled=False' in s
              assert s==Path("development/v5.3.0_case_number_ocr.py").read_text()
          print("PASS V5.3.0 source, hash, updater compatible ZIP")
          PY
      - name: Stage checked application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development/v5.3.0_case_number_ocr.py release-assets/update.base64 release-assets/CaseNumberOCR_Update.zip release-assets/SHA256.txt release-assets/RELEASE_TAG.txt release-assets/PUBLISH_REQUEST.txt
          git diff --cached --quiet && exit 1
          git commit -m "Stage MFCase V5.3.0 local OCR secure manual updates"
          git push origin HEAD:publish/v5.3.0-offline-ocr-security
