name: Test MFCase V5.3.0 Windows updater and data preservation
# Final tagged update checksum and offline controls
on:
  push:
    branches: [publish/v5.3.0-offline-ocr-security]
    paths: [.github/workflows/test-windows-v5.3.0.yml]
permissions: {contents: read}
jobs:
  updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply real 5.3.0 two-file updater; preserve root PDFs and learning
        shell: pwsh
        run: python tools/test_update_windows_v530.py
