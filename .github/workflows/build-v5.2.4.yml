name: Build verified MFCase V5.2.4
on:
  push:
    branches: [publish/v5.2.4-progress-case-priority]
    paths: [.github/workflows/build-v5.2.4.yml]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable V5.2.3 production release
        run: git fetch --no-tags --depth=1 origin 1deedf54d65c56f6509c477ab5ac77d6f25918ff
      - name: Patch and syntax-check V5.2.4
        run: python3 tools/build_v5_2_4.py
      - name: Verify exact update contents and SHA256
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          root=Path("release-assets")
          blob=base64.b64decode(root.joinpath("update.base64").read_text(),validate=True)
          assert blob==root.joinpath("CaseNumberOCR_Update.zip").read_bytes()
          assert hashlib.sha256(blob).hexdigest()==root.joinpath("SHA256.txt").read_text().strip()
          assert root.joinpath("RELEASE_TAG.txt").read_text().strip()=="v5.2.4"
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={"case_number_ocr.py","updater_apply.py"}
              for item in z.namelist():compile(z.read(item),item,"exec")
              code=z.read("case_number_ocr.py").decode()
              assert "case_conflict_resolution" in code
              assert "scan_progress_label" in code
              assert "REVIEW SELECTED" in code
          print("PASS V5.2.4 signed source checksum, syntax and legacy update layout")
          PY
      - name: Commit checked release asset to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-assets/update.base64 release-assets/CaseNumberOCR_Update.zip release-assets/SHA256.txt release-assets/RELEASE_TAG.txt release-assets/PUBLISH_REQUEST.txt
          git diff --cached --quiet && exit 1
          git commit -m "Stage MFCase 5.2.4 verified progress and OCR conflict improvements"
          git push origin HEAD:publish/v5.2.4-progress-case-priority
