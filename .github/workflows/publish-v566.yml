name: Publish MFCase v5.6.6 simplified OCR
on:
  push:
    branches:
      - publish/v5.6.6
    paths:
      - .github/workflows/publish-v566.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mfcase-publish-v566
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless regression prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install numpy pillow 'pymupdf<2.0' opencv-python-headless
      - name: Download and validate the actual v5.6.5 production source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p baseline stage transfer dist verify
          gh release download v5.6.5 --repo "$GITHUB_REPOSITORY" --pattern MFCase_Number_OCR_V5.6.5_Full_Online_Install.zip --dir baseline
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          file=Path('baseline/MFCase_Number_OCR_V5.6.5_Full_Online_Install.zip')
          assert sha256(file.read_bytes()).hexdigest()=='25dbdaf783fff40f8166ee4ae163b83660d595e5a623255e7aca1916a5e463ab','Production package has changed'
          with ZipFile(file) as z:
              assert z.testzip() is None
              assert all('..' not in Path(name).parts and not name.startswith('/') for name in z.namelist())
              z.extractall('stage')
          path=next(Path('stage').rglob('case_number_ocr.py'))
          code=path.read_text(encoding='utf-8')
          assert 'self.app_version = "5.6.5"' in code
          assert 'root.title("M.F. Case Number OCR — V5.6.5")' in code
          assert 'def _load_user_settings(' in code, 'Must retain latest auto-send settings'
          print('Official production source SHA-256',sha256(path.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Decode previously tested source changes and regressions
        run: |
          python - <<'PY'
          import base64,hashlib
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          encoded=Path('tools/v566_release_payload.b64').read_text().strip()
          assert len(encoded)==9396
          payload=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(payload).hexdigest()=='8fe0112a35412537c913cee5d0e70b06e33e74c207aea0f0fc0d83afd6d09b10'
          with ZipFile(BytesIO(payload)) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={'patch_566.py','test_release_566.py','package_566.py'}
              z.extractall('transfer')
          print('Tested source-patch payload integrity: PASS',flush=True)
          PY
      - name: Patch v5.6.5 OCR gate without altering learning data or UI
        run: |
          set -eu
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          python transfer/patch_566.py "$APP/case_number_ocr.py"
          mkdir -p "$APP/tests"
          cp transfer/test_release_566.py "$APP/tests/test_release_566.py"
          python -m py_compile "$APP/case_number_ocr.py" "$APP/updater_apply.py"
          grep -q 'self.app_version = "5.6.6"' "$APP/case_number_ocr.py"
          grep -q 'Case Number OCR — V5.6.6' "$APP/case_number_ocr.py"
      - name: Run old and new strict-08 OCR regressions and GUI smoke test
        run: |
          set -eu
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          PYTHONPATH="$APP" python -m unittest discover -s "$APP/tests" -p 'test_release_5*.py' -v
          MFCASE_SKIP_STARTUP_MAINTENANCE=1 PYTHONPATH="$APP" xvfb-run -a python - <<'PY'
          import tkinter as tk
          from case_number_ocr import App
          root=tk.Tk()
          a=App(root)
          root.update_idletasks()
          assert a.app_version=='5.6.6'
          assert 'V5.6.6' in root.title()
          assert a.tree.winfo_exists()
          root.destroy()
          print('PASS single-screen GUI startup')
          PY
      - name: Create full installer, test updater, protect private case data
        run: |
          set -eu
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          python transfer/package_566.py "$APP" dist
          test -s dist/CaseNumberOCR_Update.zip
          test -s dist/MFCase_Number_OCR_V5.6.6_Full_Online_Install.zip
      - name: Publish current version and verify download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=v5.6.6
          APP="$(dirname "$(find stage -name case_number_ocr.py -print -quit)")"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "MFCase v5.6.6" --notes-file "$APP/CHANGELOG_V5_6_6.txt"
          fi
          gh release upload "$TAG" "$PWD/dist/CaseNumberOCR_Update.zip" "$PWD/dist/MFCase_Number_OCR_V5.6.6_Full_Online_Install.zip" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern CaseNumberOCR_Update.zip --dir verify
          cmp dist/CaseNumberOCR_Update.zip verify/CaseNumberOCR_Update.zip
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
