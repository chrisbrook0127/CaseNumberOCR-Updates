name: Regression-test MFCase v5.1.2 before publication
# Test harness indentation fix
on:
  push:
    branches: [publish/v5.1.2-region3]
    paths: [.github/workflows/test-v5.1.2.yml]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight array dependency for synthetic PDF tests
        run: python -m pip install --quiet numpy pillow
      - name: Run exact shipped-method 3in OCR, 95% neighbor and modified-date tests
        run: python tools/test_v5_1_2.py
